# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.12.x, 1.13.x, 1.14.x]
    runs-on: self-hosted
    steps:
    - name: Keep Go's paths in this job
      run: |
        chmod -R u+w "$RUNNER_TEMP/gopath" 2>/dev/null || true
        rm -rf "$RUNNER_TEMP/gopath" "$RUNNER_TEMP/go-build"
        echo "GOPATH=$RUNNER_TEMP/gopath" >> "$GITHUB_ENV"
        echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Test
      run: go test ./...
    - name: Make the module cache removable
      if: always()
      run: chmod -R u+w "$RUNNER_TEMP/gopath" 2>/dev/null || true
